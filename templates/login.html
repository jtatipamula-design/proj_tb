<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brihas ERP - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <script>
        // Check theme instantly to prevent flashing
        if (localStorage.getItem('theme') === 'light') {
            document.documentElement.classList.add('light-mode');
        }
    </script>

    <style>
        :root {
            /* Minimalist Enterprise SaaS Theme */
            --color-obsidian-canvas: #101010;
            --color-carbon-lift: #1d1a18;
            --color-ash-stroke: #3d3a39;
            --color-graphite-mid: #4d4947;
            --color-warm-granite: #8a8380;
            --color-pale-stone: #b8b3b0;
            --color-bone: #eeeeee;
            --color-chalk: #fafafa;
            --color-signal-orange: #ee6018;
            --color-metric-green: #a0ca92;

            /* Typography */
            --font-geist: 'Geist', ui-sans-serif, system-ui, -apple-system, sans-serif;

            /* Typography — Scale */
            --text-heading: 32px;
            --leading-heading: 1.1;
            --tracking-heading: -1.12px;

            /* Border Radius */
            --radius-cards: 10px;
            --radius-buttons: 3px;
        }

        html.light-mode {
            --color-obsidian-canvas: #fafafa;
            --color-carbon-lift: #eeeeee;
            --color-ash-stroke: #b8b3b0;
            --color-graphite-mid: #8a8380;
            --color-warm-granite: #4d4947;
            --color-pale-stone: #3d3a39;
            --color-bone: #1d1a18;
            --color-chalk: #101010;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-geist);
            background-color: var(--color-obsidian-canvas);
            color: var(--color-bone);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            min-height: 100vh; overflow: hidden; position: relative;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Kinetic Grid Canvas Background */
        #kinetic-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute; top: 24px; right: 24px; z-index: 20;
            background: var(--color-carbon-lift); border: 1px solid var(--color-ash-stroke);
            border-radius: var(--radius-buttons); width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; color: var(--color-warm-granite); transition: all 0.2s ease;
        }
        .theme-toggle:hover { color: var(--color-bone); transform: scale(1.05); border-color: var(--color-graphite-mid); }

        /* ========================================= */
        /* LOGIN CARD STYLING                        */
        /* ========================================= */
        .login-card {
            position: relative;
            width: 100%; max-width: 400px;
            border-radius: var(--radius-cards);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
            z-index: 10;
            background: rgba(29, 26, 24, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        html.light-mode .login-card {
            background: rgba(255, 255, 255, 0.55);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .login-card-inner {
            padding: 40px;
            position: relative;
            z-index: 1;
            height: 100%;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .login-header { text-align: center; margin-bottom: 32px; }
        .login-header h1 { 
            font-size: var(--text-heading); 
            line-height: var(--leading-heading);
            letter-spacing: var(--tracking-heading);
            font-weight: 500; color: var(--color-bone); margin-bottom: 8px; 
        }
        .login-header p { color: var(--color-warm-granite); font-size: 14px; }

        /* Form Inputs & Floating Labels */
        .form-field { position: relative; margin-bottom: 24px; }
        .form-field label {
            position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
            font-size: 15px; color: var(--color-warm-granite); pointer-events: none;
            transition: all 0.2s ease; background: transparent; padding: 0 4px;
        }
        
        .form-field.active label {
            top: 0; transform: translateY(-50%) scale(0.85);
            color: var(--color-bone); background: rgba(16, 16, 16, 0.9);
            border-radius: 2px;
        }
        html.light-mode .form-field.active label { background: rgba(250, 250, 250, 0.9); color: var(--color-obsidian-canvas); }

        .form-field input {
            width: 100%; padding: 14px 14px; border: 1px solid var(--color-ash-stroke);
            border-radius: var(--radius-buttons); font-size: 15px; font-family: var(--font-geist);
            background-color: rgba(16, 16, 16, 0.4); color: var(--color-bone);
            transition: all 0.2s; outline: none;
        }
        html.light-mode .form-field input { background-color: rgba(255, 255, 255, 0.4); color: var(--color-obsidian-canvas); }

        .form-field.active input {
            border-color: var(--color-pale-stone);
        }

        .toggle-password {
            position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
            background: transparent; border: none; color: var(--color-warm-granite);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: color 0.2s; padding: 4px;
        }
        .toggle-password:hover { color: var(--color-bone); }

        .form-options {
            display: flex; justify-content: flex-start; align-items: center;
            margin-bottom: 28px; font-size: 13px; color: var(--color-warm-granite);
        }
        .remember-me { display: flex; align-items: center; gap: 8px; cursor: pointer; user-select: none; }
        .remember-me input { accent-color: var(--color-signal-orange); width: 14px; height: 14px; cursor: pointer; }
        
        /* ========================================= */
        /* SMOOTH ANIMATED LOGIN BUTTON              */
        /* ========================================= */
        .login-button {
            position: relative; width: 100%; height: 48px; 
            background: var(--color-signal-orange); color: #ffffff;
            border: none; border-radius: var(--radius-buttons); font-size: 15px; font-weight: 500; font-family: var(--font-geist);
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }
        .login-button:hover:not(.is-loading):not(.is-success) { 
            background: #f0702d; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(238, 96, 24, 0.25); 
        }

        /* HeroUI Custom Spinner */
        .heroui-spinner {
            width: 22px; height: 22px;
            animation: hero-spin 0.8s linear infinite;
        }
        @keyframes hero-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Inner Button Layers */
        .btn-text {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 1; transform: translateY(0);
        }
        .btn-spinner {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(20px);
        }
        .btn-success {
            position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); opacity: 0; transform: translateY(20px) scale(0.8);
        }

        /* Loading State */
        .login-button.is-loading { cursor: not-allowed; pointer-events: none; opacity: 0.9; }
        .login-button.is-loading .btn-text { opacity: 0; transform: translateY(-20px); }
        .login-button.is-loading .btn-spinner { opacity: 1; transform: translateY(0); }

        /* Success State */
        .login-button.is-success { background: var(--color-metric-green) !important; color: #101010; cursor: default; pointer-events: none; }
        .login-button.is-success .btn-text, .login-button.is-success .btn-spinner { opacity: 0; transform: translateY(-20px); }
        .login-button.is-success .btn-success { opacity: 1; transform: translateY(0) scale(1); }

        #error-msg {
            color: var(--color-signal-orange); font-size: 14px; font-weight: 500;
            margin-top: 16px; min-height: 20px; opacity: 0; transition: opacity 0.3s; text-align: center;
        }
    </style>
</head>
<body>

    <!-- The Vanilla JS Port of the Kinetic Grid -->
    <canvas id="kinetic-canvas"></canvas>

    <!-- Theme Toggle -->
    <div class="theme-toggle" onclick="toggleTheme()" id="themeToggleBtn">
        <i data-lucide="moon" id="themeIcon"></i>
    </div>

    <div class="login-card" id="loginCard">
        <div class="login-card-inner">
            <div class="login-header">
                <h1>Welcome</h1>
                <p>Please sign in to continue</p>
            </div>

            <form class="login-form space-y-5" id="loginForm" onsubmit="handleLogin(event)">
                
                <!-- Username Field -->
                <div class="flex flex-col space-y-1.5 text-left">
                    <label for="username" class="text-xs font-semibold uppercase tracking-wider text-[#b8b3b0]">Username</label>
                    <div class="relative">
                        <input type="text" 
                               id="username" 
                               required 
                               autocomplete="username" 
                               placeholder="Enter your username"
                               class="w-full px-3.5 py-3 border border-[#3d3a39] rounded-[3px] text-sm font-geist bg-[rgba(16,16,16,0.4)] text-[#eeeeee] placeholder-[#8a8380] focus:outline-none focus:border-[#b8b3b0] transition-all">
                    </div>
                </div>

                <!-- Password Field -->
                <div class="flex flex-col space-y-1.5 text-left">
                    <label for="password" class="text-xs font-semibold uppercase tracking-wider text-[#b8b3b0]">Password</label>
                    <div class="relative">
                        <input type="password" 
                               id="password" 
                               required 
                               autocomplete="current-password" 
                               placeholder="Enter your password"
                               class="w-full pl-3.5 pr-11 py-3 border border-[#3d3a39] rounded-[3px] text-sm font-geist bg-[rgba(16,16,16,0.4)] text-[#eeeeee] placeholder-[#8a8380] focus:outline-none focus:border-[#b8b3b0] transition-all">
                        <button type="button" 
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-[#8a8380] hover:text-[#eeeeee] p-1 transition-colors flex items-center justify-center" 
                                onclick="togglePasswordVisibility()" 
                                aria-label="Toggle password visibility">
                            <i data-lucide="eye" id="eyeIcon" style="width: 18px; height: 18px;"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options pt-1">
                    <label class="remember-me flex items-center gap-2 cursor-pointer select-none text-xs text-[#8a8380]">
                        <input type="checkbox" id="rememberMe" class="accent-[#ee6018] w-3.5 h-3.5">
                        Remember me
                    </label>
                </div>

                <button type="submit" class="login-button" id="loginBtn">
                    <div class="btn-text">Sign In</div>
                    <div class="btn-spinner">
                        <!-- HeroUI Spinner Implementation -->
                        <svg class="heroui-spinner" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="12" cy="12" r="10" stroke="currentColor" stroke-opacity="0.25" stroke-width="3"></circle>
                            <path d="M12 2a10 10 0 0 1 10 10" stroke="currentColor" stroke-width="3" stroke-linecap="round"></path>
                        </svg>
                    </div>
                    <div class="btn-success"><i data-lucide="check" style="width: 20px;"></i> Authenticated</div>
                </button>
                
                <div id="error-msg">Invalid Credentials</div>
            </form>
        </div>
    </div>

    <script>
        lucide.createIcons();

        // -----------------------------------------
        // REACT STATE REPLICA FOR FLOATING LABELS
        // -----------------------------------------
        const inputs = document.querySelectorAll('.form-field input');
        inputs.forEach(input => {
            const wrapper = input.parentElement;
            const updateState = () => {
                if (input.value.trim() !== '' || document.activeElement === input) wrapper.classList.add('active');
                else wrapper.classList.remove('active');
            };
            input.addEventListener('focus', updateState);
            input.addEventListener('blur', updateState);
            input.addEventListener('input', updateState);
            input.addEventListener('change', updateState);
            updateState();
            setTimeout(updateState, 50);
            setTimeout(updateState, 200);
            setTimeout(updateState, 500);
        });

        // -----------------------------------------
        // UI INTERACTIONS
        // -----------------------------------------
        function toggleTheme() {
            const html = document.documentElement;
            const isLight = html.classList.toggle('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            const themeIcon = document.getElementById('themeIcon');
            themeIcon.setAttribute('data-lucide', isLight ? 'sun' : 'moon');
            lucide.createIcons();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const isLight = document.documentElement.classList.contains('light-mode');
            document.getElementById('themeIcon').setAttribute('data-lucide', isLight ? 'sun' : 'moon');
            lucide.createIcons();
        });

        function togglePasswordVisibility() {
            const pwdInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                eyeIcon.setAttribute('data-lucide', 'eye-off');
            } else {
                pwdInput.type = 'password';
                eyeIcon.setAttribute('data-lucide', 'eye');
            }
            lucide.createIcons();
        }

        // -----------------------------------------
        // KINETIC GRID (Vanilla JS Port)
        // -----------------------------------------
        const canvas = document.getElementById("kinetic-canvas");
        const ctx = canvas.getContext("2d");
        
        let W = window.innerWidth;
        let H = window.innerHeight;
        let cols = [];
        let dots = [];
        const mouse = { x: -9999, y: -9999, active: false };
        
        // Physics Settings
        const spacing = 35; 
        const radius = 250; 
        const strength = 4;
        const PULL = (Math.max(1, Math.min(10, strength)) / 10) * 4;

        function buildGrid() {
            W = window.innerWidth;
            H = window.innerHeight;
            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.floor(W * dpr);
            canvas.height = Math.floor(H * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            cols = [];
            dots = [];
            const nCols = Math.floor(W / spacing) + 2;
            const nRows = Math.floor(H / spacing) + 2;

            for (let c = 0; c < nCols; c++) {
                const col = [];
                for (let rIdx = 0; rIdx < nRows; rIdx++) {
                    const hx = c * spacing;
                    const hy = rIdx * spacing;
                    const d = { hx, hy, x: hx, y: hy, vx: 0, vy: 0 };
                    col.push(d);
                    dots.push(d);
                }
                cols.push(col);
            }
        }

        window.addEventListener("resize", buildGrid);
        buildGrid();

        // Mouse Listeners
        const setMouse = (clientX, clientY) => {
            mouse.x = clientX;
            mouse.y = clientY;
            mouse.active = true;
        };

        window.addEventListener("mousemove", (e) => setMouse(e.clientX, e.clientY));
        window.addEventListener("touchmove", (e) => {
            if(e.touches[0]) setMouse(e.touches[0].clientX, e.touches[0].clientY);
        }, { passive: true });
        
        const clearMouse = () => { mouse.active = false; };
        window.addEventListener("mouseleave", clearMouse);
        window.addEventListener("touchend", clearMouse);

        // Animation Loop
        function animateGrid() {
            ctx.clearRect(0, 0, W, H);
            
            // Dynamic Theme Colors (Brighter Grid)
            const isLight = document.documentElement.classList.contains('light-mode');
            const dotColor = isLight ? "rgba(29, 26, 24, 0.6)" : "rgba(255, 255, 255, 0.5)"; 
            const lineColor = isLight ? "rgba(61, 58, 57, 0.3)" : "rgba(255, 255, 255, 0.2)"; 

            // Physics Update
            for (const d of dots) {
                let ax = (d.hx - d.x) * 0.08;
                let ay = (d.hy - d.y) * 0.08;
                if (mouse.active) {
                    const dx = mouse.x - d.x;
                    const dy = mouse.y - d.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < radius && dist > 0.001) {
                        const f = (1 - dist / radius) * PULL;
                        ax += (dx / dist) * f;
                        ay += (dy / dist) * f;
                    }
                }
                d.vx = (d.vx + ax) * 0.82;
                d.vy = (d.vy + ay) * 0.82;
                d.x += d.vx;
                d.y += d.vy;
            }

            // Draw Lines
            for (let c = 0; c < cols.length; c++) {
                for (let rIdx = 0; rIdx < cols[c].length; rIdx++) {
                    const d = cols[c][rIdx];
                    const right = cols[c + 1]?.[rIdx];
                    const down = cols[c]?.[rIdx + 1];
                    const prox = mouse.active ? Math.max(0, 1 - Math.sqrt((mouse.x - d.x) ** 2 + (mouse.y - d.y) ** 2) / radius) : 0;
                    
                    if (right) {
                        ctx.globalAlpha = 0.15 + prox * 0.6;
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 0.5 + prox * 1.5;
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(right.x, right.y); ctx.stroke();
                    }
                    if (down) {
                        ctx.globalAlpha = 0.15 + prox * 0.6;
                        ctx.strokeStyle = lineColor;
                        ctx.lineWidth = 0.5 + prox * 1.5;
                        ctx.beginPath(); ctx.moveTo(d.x, d.y); ctx.lineTo(down.x, down.y); ctx.stroke();
                    }
                }
            }

            // Draw Dots
            for (const d of dots) {
                const prox = mouse.active ? Math.max(0, 1 - Math.sqrt((mouse.x - d.x) ** 2 + (mouse.y - d.y) ** 2) / radius) : 0;
                ctx.globalAlpha = 0.4 + prox * 0.6;
                ctx.fillStyle = dotColor;
                ctx.beginPath(); ctx.arc(d.x, d.y, 1 + prox * 2.5, 0, 2 * Math.PI); ctx.fill();
            }

            ctx.globalAlpha = 1;
            requestAnimationFrame(animateGrid);
        }
        animateGrid();

        // -----------------------------------------
        // LOGIN LOGIC (Sanic API Integration)
        // -----------------------------------------
        async function handleLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const err = document.getElementById('error-msg');
            
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Trigger the ultra-smooth loading state
            btn.classList.add('is-loading');
            err.style.opacity = "0";

            try {
                const res = await fetch("/login", {
                    method: "POST", 
                    headers: {"Content-Type": "application/json"}, 
                    body: JSON.stringify({username: u, password: p})
                });

                if (res.ok) {
                    // Trigger the success state morph
                    btn.classList.remove('is-loading');
                    btn.classList.add('is-success');
                    
                    // Delay slightly to let the user enjoy the animation before redirecting
                    setTimeout(() => window.location.href = "/", 800);
                } else {
                    const data = await res.json();
                    err.innerText = data.error || data.message || "Invalid Credentials";
                    err.style.opacity = "1";
                    btn.classList.remove('is-loading');
                }
            } catch (error) {
                err.innerText = "Network Error. Please try again.";
                err.style.opacity = "1";
                btn.classList.remove('is-loading');
            }
        }
    </script>
</body>
</html>
