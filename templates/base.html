<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brihas ERP - {% block head_title %}Dynamic Engine{% endblock %}</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <script src="https://unpkg.com/htmx.org@1.9.12/dist/ext/preload.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a', 950: '#042f2e' },
                        dark: { bg: '#05060f', surface: '#111827', border: '#1f2937' }
                    },
                    fontFamily: {
                        ui: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace']
                    }
                }
            }
        }
    </script>
    
    <style>
        [x-cloak] { display: none !important; }
        
        :root {
            /* Glassmorphism Design Tokens */
            --color-midnight-ink: #05060f;
            --color-graphite-plate: #2f343e;
            --color-steel-border: rgba(255, 255, 255, 0.1);
            --color-fog: #81899b;
            --color-pebble: #9da7ba;
            --color-moonlight: #c7d3ea;
            --color-glacier: #d8ecf8;
            --color-frost-link: #b6d9fc;
            --color-electric-iris: #663af3;
            --color-ember: #e46d4c;
            --color-cipher-mint: #269684;
            --glass-surface: rgba(10, 35, 38, 0.55);
            --glass-bg: rgba(10, 35, 38, 0.55);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-ui: 'Inter', ui-sans-serif, system-ui, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        html:not(.dark) {
            --color-midnight-ink: #f8fafc;
            --color-graphite-plate: #ffffff;
            --color-steel-border: #e2e8f0;
            --color-fog: #64748b;
            --color-pebble: #475569;
            --color-moonlight: #334155;
            --color-glacier: #0f172a;
            --glass-surface: rgba(255, 255, 255, 0.65);
            --glass-bg: rgba(255, 255, 255, 0.65);
            --glass-border: rgba(0, 0, 0, 0.08);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.3); border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }

        /* Abyssal Background System — Grid + Bioluminescent Orbs */
        .abyssal-bg {
            position: fixed; inset: 0; z-index: 0;
            background-color: var(--color-midnight-ink);
            transition: background-color 0.3s;
            overflow: hidden;
            pointer-events: none;
        }

        .abyssal-grid {
            position: absolute; inset: 0;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            z-index: 1;
            transition: opacity 0.3s;
        }

        html:not(.dark) .abyssal-grid {
            background-image:
                linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
        }

        .flux-canvas {
            position: absolute; inset: -15%; /* Oversized so parallax doesn't reveal edges */
            width: 130%; height: 130%;
            pointer-events: none;
            opacity: 0.40;
            mix-blend-mode: screen;
            transform: translate(0px, 0px);
            animation: moveFlux 30s ease-in-out infinite;
            z-index: 0;
            transition: opacity 0.3s;
            will-change: transform;
        }

        html:not(.dark) .flux-canvas {
            opacity: 0.35;
            mix-blend-mode: multiply;
        }

        @keyframes moveFlux {
            0%   { transform: translate(var(--flux-mx, 0px), var(--flux-my, 0px)) scale(1.15) translate(0%, 0%); }
            25%  { transform: translate(var(--flux-mx, 0px), var(--flux-my, 0px)) scale(1.18) translate(-3%, 2%); }
            50%  { transform: translate(var(--flux-mx, 0px), var(--flux-my, 0px)) scale(1.15) translate(-5%, -2%); }
            75%  { transform: translate(var(--flux-mx, 0px), var(--flux-my, 0px)) scale(1.18) translate(2%, -4%); }
            100% { transform: translate(var(--flux-mx, 0px), var(--flux-my, 0px)) scale(1.15) translate(0%, 0%); }
        }

        /* Glassmorphism Panels */
        .glass-panel {
            background: var(--glass-surface);
            backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
            border-color: var(--glass-border);
            transition: all 0.3s ease;
        }

        /* Light/Dark mode body transition */
        body {
            font-family: var(--font-ui);
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Toast Notifications */
        .toast-container { position: fixed; bottom: 30px; right: 30px; z-index: 9999; display: flex; flex-direction: column; gap: 12px; }
        .toast {
            background: var(--glass-surface); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
            color: var(--color-glacier); padding: 14px 18px; border-radius: 10px; display: flex; align-items: center; gap: 12px;
            animation: slideIn 0.4s ease, fadeOut 0.4s ease 3.5s forwards; font-weight: 500; font-size: 14px;
        }
        @keyframes slideIn { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
        @keyframes fadeOut { to { opacity: 0; transform: translateY(10px); } }

        /* Universal Theme Transition */
        .theme-transitioning,
        .theme-transitioning *,
        .theme-transitioning *::before,
        .theme-transitioning *::after {
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease, fill 0.3s ease, stroke 0.3s ease, opacity 0.3s ease !important;
            transition-delay: 0s !important;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-[#05060f] dark:text-[#c7d3ea] relative overflow-hidden antialiased font-ui"
      x-data="{ 
          sidebarOpen: localStorage.getItem('sidebarOpen') !== 'false',
          isNavigating: false,
          theme: localStorage.getItem('theme') || 'dark',
          searchQuery: '',
          openModules: JSON.parse(localStorage.getItem('openModules') || '{}'),
          toggleModule(mod) {
              this.openModules[mod] = !this.openModules[mod];
              localStorage.setItem('openModules', JSON.stringify(this.openModules));
          },
          openAndFocusModule(mod) {
              this.sidebarOpen = true;
              this.openModules[mod] = true;
              localStorage.setItem('sidebarOpen', 'true');
              localStorage.setItem('openModules', JSON.stringify(this.openModules));
              this.$nextTick(() => {
                  const el = document.getElementById('sidebar-mod-' + encodeURIComponent(mod));
                  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
              });
          },
          toggleTheme() {
              document.documentElement.classList.add('theme-transitioning');
              
              this.theme = this.theme === 'dark' ? 'light' : 'dark';
              localStorage.setItem('theme', this.theme);
              if (this.theme === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.classList.remove('light-mode'); } 
              else { document.documentElement.classList.remove('dark'); document.documentElement.classList.add('light-mode'); }

              setTimeout(() => {
                  document.documentElement.classList.remove('theme-transitioning');
              }, 300);
          }
      }"
      x-init="if (theme === 'dark') { document.documentElement.classList.add('dark'); document.documentElement.classList.remove('light-mode'); } else { document.documentElement.classList.remove('dark'); document.documentElement.classList.add('light-mode'); }"
      x-effect="localStorage.setItem('sidebarOpen', sidebarOpen)">

    <!-- Animated Flux Background + Subtle Grid -->
    <div class="abyssal-bg">
        <svg class="flux-canvas" xmlns="http://www.w3.org/2000/svg" version="1.1" xmlns:xlink="http://www.w3.org/1999/xlink" xmlns:svgjs="http://svgjs.dev/svgjs" viewBox="0 0 700 700" preserveAspectRatio="none">
            <defs>
                <linearGradient gradientTransform="rotate(314, 0.5, 0.5)" x1="50%" y1="0%" x2="50%" y2="100%" id="ffflux-gradient">
                    <stop stop-color="hsl(138, 100%, 72%)" stop-opacity="1" offset="0%"></stop>
                    <stop stop-color="hsl(227, 100%, 50%)" stop-opacity="1" offset="100%"></stop>
                </linearGradient>
                <filter id="ffflux-filter" x="-20%" y="-20%" width="140%" height="140%" filterUnits="objectBoundingBox" primitiveUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
                    <feTurbulence type="fractalNoise" baseFrequency="0.005 0.003" numOctaves="2" seed="2" stitchTiles="stitch" x="0%" y="0%" width="100%" height="100%" result="turbulence"></feTurbulence>
                    <feGaussianBlur stdDeviation="20 0" x="0%" y="0%" width="100%" height="100%" in="turbulence" edgeMode="duplicate" result="blur"></feGaussianBlur>
                    <feBlend mode="soft-light" x="0%" y="0%" width="100%" height="100%" in="SourceGraphic" in2="blur" result="blend"></feBlend>
                </filter>
            </defs>
            <rect width="100%" height="100%" fill="url(#ffflux-gradient)" filter="url(#ffflux-filter)"></rect>
        </svg>
        <div class="abyssal-grid"></div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>
    <div id="app-body" class="flex h-screen overflow-hidden relative z-10">
        
        <!-- Sidebar -->
        <aside class="glass-panel flex-shrink-0 flex flex-col transition-all duration-300 ease-in-out overflow-hidden z-20 border-r"
               style="border-color: var(--glass-border);"
               :class="sidebarOpen ? 'w-72 opacity-100' : 'w-0 opacity-0 border-r-0'">
            <div class="w-72 flex flex-col h-full flex-shrink-0">
                <!-- Branding -->
                <div class="p-6 flex items-center justify-between" style="border-bottom: 1px solid var(--glass-border);">
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight" style="color: var(--color-glacier);">
                            <a href="/" preload="mouseover" class="flex items-center gap-3">
                                <i data-lucide="layers" class="w-6 h-6"></i>
                                <span>Brihas ERP</span>
                            </a>
                        </h1>
                        <p class="text-xs mt-0.5 uppercase font-semibold tracking-widest font-mono" style="color: var(--color-fog);">Enterprise</p>
                    </div>
                </div>

                <!-- Sidebar Search -->
                <div class="px-4 pt-4 pb-2">
                    <div class="relative">
                        <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2" style="color: var(--color-fog);"></i>
                        <input type="text" x-model="searchQuery" placeholder="Search modules..." 
                                class="w-full rounded-lg pl-9 pr-4 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-brand-500 transition-all"
                                style="background: var(--color-midnight-ink); border: 1px solid var(--glass-border); color: var(--color-moonlight);">
                    </div>
                </div>

                <!-- Module Tree Navigation -->
                <div class="flex-1 overflow-y-auto py-2 px-3 space-y-1.5">
                    {% for module_name, screens in modules_tree.items() %}
                    <div id="sidebar-mod-{{ module_name | urlencode }}" 
                         x-show='searchQuery === "" || {{ module_name | tojson }}.toLowerCase().includes(searchQuery.toLowerCase()) || [{% for s in screens %}{{ s.search_terms | tojson }}{% if not loop.last %},{% endif %}{% endfor %}].some(n => n.includes(searchQuery.toLowerCase()))'
                         class="mb-1">

                        <button @click="toggleModule({{ module_name | tojson }})" 
                                :class="{ 'ring-1 ring-brand-500/30': openModules[{{ module_name | tojson }}] }"
                                class="w-full flex items-center justify-between px-3 py-2.5 text-sm font-medium rounded-lg transition-all"
                                :style="openModules[{{ module_name | tojson }}] ? 'background: rgba(186, 215, 247, 0.12); color: var(--color-frost-link);' : 'color: var(--color-moonlight);'"
                                @mouseenter="$el.style.background = openModules[{{ module_name | tojson }}] ? 'rgba(186, 215, 247, 0.12)' : 'rgba(186, 215, 247, 0.08)'"
                                @mouseleave="$el.style.background = openModules[{{ module_name | tojson }}] ? 'rgba(186, 215, 247, 0.12)' : 'transparent'">
                            <span class="flex items-center gap-3">
                                <i data-lucide="folder" class="w-4 h-4"></i>
                                {{ module_name }}
                            </span>
                            <i data-lucide="chevron-down" class="w-4 h-4 transition-transform opacity-60" 
                               :class="{'rotate-180': openModules[{{ module_name | tojson }}]}"></i>
                        </button>
                        
                        <!-- Nested Screens -->
                        <div x-show="openModules[{{ module_name | tojson }}]" 
                             x-collapse 
                             x-cloak 
                             class="mt-1 space-y-1 px-2 ml-6 py-1" 
                             style="border-left: 2px solid var(--glass-border);">
                            {% for screen in screens %}
                            <a href="/table/{{ screen.code }}" 
                               preload="mouseover"
                               class="block px-3 py-1.5 text-sm rounded-lg transition-colors flex items-center gap-2"
                               style="color: var(--color-pebble);"
                               onmouseenter="this.style.background='rgba(186, 215, 247, 0.08)'; this.style.color='var(--color-glacier)';"
                               onmouseleave="this.style.background='transparent'; this.style.color='var(--color-pebble)';">
                                <i data-lucide="database" class="w-3.5 h-3.5"></i>
                                {{ screen.name }}
                            </a>
                            {% endfor %}
                        </div>
                    </div>
                    {% endfor %}
                </div>

                <!-- User Profile & Theme Toggle -->
                <div class="p-4" style="border-top: 1px solid var(--glass-border); background: var(--glass-surface);">
                    <!-- Theme Toggle -->
                    <div class="flex justify-end mb-3">
                        <button @click="toggleTheme()" 
                                class="p-2 rounded-lg transition-all"
                                style="background: var(--color-midnight-ink); border: 1px solid var(--glass-border); color: var(--color-fog);"
                                title="Toggle Theme">
                            <i data-lucide="sun" x-show="theme === 'dark'" x-cloak class="w-4 h-4"></i>
                            <i data-lucide="moon" x-show="theme === 'light'" class="w-4 h-4"></i>
                        </button>
                    </div>
                    <!-- User Info -->
                    <div class="flex items-center gap-3">
                        <a href="/form/phc_users_t/{{ user_id }}" 
                           class="flex items-center gap-3 flex-1 min-w-0 group cursor-pointer text-decoration-none"
                           title="View User Profile">
                            <div class="w-10 h-10 rounded-lg flex items-center justify-center text-sm font-bold transition-all group-hover:border-brand-500"
                                 style="background: rgba(186, 215, 247, 0.08); border: 1px solid var(--glass-border); color: var(--color-glacier);">
                                {{ username[:2] | upper }}
                            </div>
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-bold truncate group-hover:text-brand-400" style="color: var(--color-glacier);">{{ username }}</p>
                                <p class="text-xs font-medium font-mono" style="color: var(--color-cipher-mint);">{{ user_role }}</p>
                            </div>
                        </a>
                        <a href="/logout" hx-boost="false" class="p-2 rounded-lg transition-colors" 
                           style="color: var(--color-ember);"
                           onmouseenter="this.style.background='rgba(228, 109, 76, 0.1)'"
                           onmouseleave="this.style.background='transparent'"
                           title="Logout">
                            <i data-lucide="log-out" class="w-5 h-5"></i>
                        </a>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 flex flex-col h-screen overflow-hidden relative">

            <!-- Top Header -->
            <header class="glass-panel border-b px-6 py-4 flex items-center justify-between sticky top-0 z-10 transition-all duration-300 ease-in-out"
                    style="border-color: var(--glass-border);">
                <div class="flex items-center gap-4">
                    <button @click="sidebarOpen = !sidebarOpen" 
                            class="p-2 rounded-lg transition-all"
                            style="color: var(--color-fog); background: var(--color-midnight-ink); border: 1px solid var(--glass-border);"
                            onmouseenter="this.style.color='var(--color-glacier)'"
                            onmouseleave="this.style.color='var(--color-fog)'">
                        <i data-lucide="panel-left" class="w-5 h-5"></i>
                    </button>
                    <h2 id="header-title" class="text-xl font-bold tracking-wide" style="color: var(--color-glacier);">{% block header_title %}Command Center{% endblock %}</h2>
                </div>
            </header>

            <!-- Dynamic Content Block -->
            <div id="main-dynamic-content" class="flex-1 overflow-y-auto p-6 md:p-8 scroll-smooth relative z-0">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // ======== SUBTLE KINETIC PARALLAX ON GRADIENT ========
        (function initFluxParallax() {
            const fluxEl = document.querySelector('.flux-canvas');
            if (!fluxEl) return;

            let targetX = 0, targetY = 0;
            let currentX = 0, currentY = 0;

            document.addEventListener('mousemove', (e) => {
                const hw = window.innerWidth / 2;
                const hh = window.innerHeight / 2;
                targetX = ((e.clientX - hw) / hw) * 20;
                targetY = ((e.clientY - hh) / hh) * 20;
            });

            document.addEventListener('mouseleave', () => {
                targetX = 0;
                targetY = 0;
            });

            function lerp() {
                currentX += (targetX - currentX) * 0.04;
                currentY += (targetY - currentY) * 0.04;
                fluxEl.style.setProperty('--flux-mx', currentX.toFixed(2) + 'px');
                fluxEl.style.setProperty('--flux-my', currentY.toFixed(2) + 'px');
                requestAnimationFrame(lerp);
            }
            lerp();
        })();

        // Re-initialize Lucide icons and synchronize header title on HTMX transitions
        document.addEventListener('htmx:afterSwap', function(evt) {
            lucide.createIcons();
            const titleEl = document.querySelector('title');
            if (titleEl) {
                const cleanTitle = titleEl.innerText.replace('Nexus ERP - ', '').trim();
                const headerTitle = document.getElementById('header-title');
                if (headerTitle && cleanTitle) {
                    headerTitle.innerText = cleanTitle;
                }
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Handle pending toast messages
            const pendingToast = sessionStorage.getItem('pendingToast');
            if (pendingToast) {
                const toastData = JSON.parse(pendingToast);
                showToast(toastData.msg, toastData.type);
                sessionStorage.removeItem('pendingToast');
            }
        });

        // ======== HELPER TO OPEN MODULE ACCORDION IN SIDEBAR ========
        window.openSidebarModule = function(moduleName) {
            window.dispatchEvent(new CustomEvent('open-module', { detail: { module: moduleName } }));
        };
    </script>
</body>
</html>
